name: macOS build

on:
  push:
    branches: [main, codex/merge-macos]
  pull_request:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: YAgent-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
