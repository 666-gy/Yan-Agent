<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Yan Agent Pet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="pet.css">
</head>
<body data-state="idle">
  <main class="pet-app">
    <section class="pet-stage" aria-label="Yan 桌宠">
      <button id="petToggle" class="pet-toggle" type="button" title="拖动桌宠，单击打开当前任务" aria-label="Yan Agent 当前状态">
        <canvas id="orbCanvas" aria-hidden="true"></canvas>
      </button>
      <button id="entertainmentPet" class="entertainment-pet" type="button" title="拖动桌宠" aria-label="娱乐桌宠" hidden>
        <span class="pet-sprite" aria-hidden="true"></span>
      </button>
      <button id="statusStrip" class="status-strip" type="button" title="拖动桌宠，单击打开当前任务" aria-label="Yan Agent 当前工作">
        <span id="compactStatus" class="shine-text">随时待命</span>
      </button>
    </section>
  </main>
  <script src="particles-orb.js"></script>
  <script src="../i18n.js"></script>
  <script src="pet.js"></script>
</body>
</html>
